</style></head><body><header><h1>✨ LivingDex</h1><small class="subtitle">Dein deutscher Pokémon-Qualitäts-Pokédex · mit Bildern</small><div class="stats"><div class="stat"><strong id="count">0</strong>von 1.025 geschafft</div><div class="stat" style="text-align:right"><strong id="percent">0,0 %</strong>Sehr groß oder Exzellent</div></div><div class="bar"><div id="progress"></div></div></header><div class="tabs"><button id="tabdex" class="active">📖 Pokédex</button><button id="tabprogress">📊 Fortschritt</button></div><section class="tools" id="toolarea"><input class="search" id="search" placeholder="🔎 Name oder Nummer suchen …" autocomplete="off"><nav id="filters"><button data-filter="all" class="active">Alle</button><button data-filter="missing">Noch offen</button><button data-filter="good">Erfüllt</button><button data-filter="excellent">Exzellent</button><button data-filter="unchecked">Ungeprüft</button></nav><div class="sortcontrols"><div><label for="dexGeneration">Generation</label><select id="dexGeneration"><option value="0">Alle Generationen</option><option value="1">Gen 1 · Kanto</option><option value="2">Gen 2 · Johto</option><option value="3">Gen 3 · Hoenn</option><option value="4">Gen 4 · Sinnoh</option><option value="5">Gen 5 · Einall</option><option value="6">Gen 6 · Kalos</option><option value="7">Gen 7 · Alola</option><option value="8">Gen 8 · Galar / Hisui</option><option value="9">Gen 9 · Paldea</option></select></div><div><label for="dexSort">Sortieren nach</label><select id="dexSort"><option value="number">Pokédex-Nummer</option><option value="name">Name</option><option value="quality">Qualität</option><option value="owned">Besitz</option></select></div><div><label for="dexDirection">Reihenfolge</label><select id="dexDirection"><option value="asc">Aufsteigend</option><option value="desc">Absteigend</option></select></div><div><label for="dexStatus">Nur anzeigen</label><select id="dexStatus"><option value="all">Alle Pokémon</option><option value="noto 'use strict';const TOTAL=1025,KEY='qualitaetsdex-v1',NAMEKEY='qualitaetsdex-names-v1',EXTRAKEY='qualitaetsdex-extra-v1';let extra={};try{extra=JSON.parse(localStorage.getItem(EXTRAKEY)||'{}')||{}}catch{}let values={},names={},filter='all',query='',dexGen='0',dexSort='number',dexDirection='asc',dexStatus='all';const fallback={1:'Bisasam',2:'Bisaknosp',3:'Bisaflor',4:'Glumanda',5:'Glutexo',6:'Glurak',7:'Schiggy',8:'Schillok',9:'Turtok',25:'Pikachu',133:'Evoli',150:'Mewtu',151:'Mew',243:'Raikou',244:'Entei',245:'Suicune',249:'Lugia',250:'Ho-Oh',251:'Celebi',382:'Kyogre',383:'Groudon',384:'Rayquaza',493:'Arceus',646:'Kyurem',791:'Solgaleo',792:'Lunala',893:'Zarude',1009:'Windewoge',1010:'Eisenblatt',1024:'Terapagos',1025:'Pecharunt'};
try{values=JSON.parse(localStorage.getItem(KEY)||'{}')||{}}catch{}try{names=JSON.parse(localStorage.getItem(NAMEKEY)||'{}')||{}}catch{};names={...fallback,...names};const list=document.getElementById('list');function save(){try{localStorage.setItem(EXTRAKEY,JSON.stringify(extra));localStorage.setItem(KEY,JSON.stringify(values))}catch{alert('Speichern nicht möglich. Bitte Browser-Speicher prüfen.')}}function draw(){const n=Object.values(values).filter(v=>v==='good'||v==='excellent').length;document.getElementById('count').textContent=n;document.getElementById('percent').textContent=(n/TOTAL*100).toFixed(1).replace('.',',')+' %';document.getElementById('progress').style.width=n/TOTAL*100+'%';list.replaceChildren();let shown=0;const frag=document.createDocumentFragment();const indices=Array.from({length:TOTAL},(_,k)=>k+1);const qualityRank={unchecked:0,low:1,good:2,excellent:3};indices.sort((a,b)=>{let cmp=0;if(dexSort==='name')cmp=(names[a]||'Pokémon #'+a).localeCompare(names[b]||'Pokémon #'+b,'de');else if(dexSort==='quality')cmp=(qualityRank[values[a]||'unchecked']-qualityRank[values[b]||'unchecked']);else if(dexSort==='owned')cmp=Number(!!extra[a]?.owned)-Number(!!extra[b]?.owned);else cmp=a-b;return (dexDirection==='desc'?-1:1)*(cmp||a-b)});for(const i of indices){const v=values[i]||'unchecked',name=names[i]||'Pokémon #'+String(i).padStart(4,'0');if(dexGen!=='0'){const [lo,hi]=ranges[Number(dexGen)-1];if(i<lo||i>hi)continue}if(dexStatus==='notowned'&&extra[i]?.owned||dexStatus==='owned'&&!extra[i]?.owned||dexStatus==='caught'&&!extra[i]?.caught||dexStatus==='notcaught'&&extra[i]?.caught||dexStatus==='unrated'&&v!=='unchecked'||dexStatus==='improve'&&(v==='good'||v==='excellent'))continue;if(filter==='missing'&&(v==='good'||v==='excellent')||filter==='good'&&!(v==='good'||v==='excellent')||filter==='excellent'&&v!=='excellent'||filter==='unchecked'&&v!=='unchecked')continue;if(query&&!name.toLocaleLowerCase('de').includes(query)&&!String(i).includes(query))continue;shown++;const row=document.createElement('div');row.className='entry '+(v==='good'?'good':v==='excellent'?'best':'');const num=document.createElement('span');num.className='num';num.textContent='#'+String(i).padStart(4,'0');const sprite=document.createElement('img');sprite.className='sprite';sprite.loading='lazy';sprite.decoding='async';sprite.width=48;sprite.height=48;sprite.alt='';sprite.src='https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/'+i+'.png';sprite.onerror=()=>{sprite.onerror=null;sprite.classList.add('failed');sprite.style.display='none'};const title=document.createElement('span');title.className='name';title.textContent=name;const flags=document.createElement('div');flags.className='flags';const own=document.createElement('button');own.className='mini'+(extra[i]?.owned?' on':'');own.textContent='✓';own.title='Im Living Dex vorhanden';own.onclick=()=>{const x=extra[i]||{};x.owned=!x.owned;if(!x.owned)x.caught=false;extra[i]=x;save();draw()};const cap=document.createElement('button');cap.className='mini'+(extra[i]?.caught?' on':'');cap.textContent='🧢';cap.title='Selbst gefangen';cap.onclick=()=>{const x=extra[i]||{};x.caught=!x.caught;if(x.caught)x.owned=true;extra[i]=x;save();draw()};flags.append(own,cap);title.onclick=()=>showDetail(i);sprite.onclick=()=>showDetail(i);const sel=document.createElement('select');sel.setAttribute('aria-label','Qualität für '+name);[['unchecked','Ungeprüft'],['low','Darunter'],['good','Sehr groß'],['excellent','Exzellent']].forEach(([value,label])=>{const o=document.createElement('option');o.value=value;o.textContent=label;sel.append(o)});sel.value=v;sel.onchange=()=>{if(sel.value==='unchecked')delete values[i];else values[i]=sel.value;save();draw()};row.append(num,sprite,title,flags,sel);frag.append(row)}if(!shown){const e=document.createElement('div');e.className='empty';e.textContent='Keine Pokémon gefunden.';frag.append(e)}list.append(frag)}[['dexGeneration','dexGen'],['dexSort','dexSort'],['dexDirection','dexDirection'],['dexStatus','dexStatus']].forEach(([id,key])=>{document.getElementById(id).onchange=e=>{const v=e.target.value;if(key==='dexGen')dexGen=v;else if(key==='dexSort')dexSort=v;else if(key==='dexDirection')dexDirection=v;else dexStatus=v;draw()}});document.getElementById('search').oninput=e=>{query=e.target.value.trim().toLocaleLowerCase('de');draw()};document.querySelectorAll('[data-filter]').forEach(b=>b.onclick=()=>{filter=b.dataset.filter;document.querySelectorAll('[data-filter]').forEach(x=>x.classList.toggle('active',x===b));draw()});function notice(s){document.getElementById('dialogText').textContent=s;document.getElementById('dialog').showModal()}document.getElementById('export').onclick=()=>{const blob=new Blob([JSON.stringify({app:'QualitätsDex',version:2,date:new Date().toISOString(),values,names,extra},null,2)],{type:'application/json'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='qualitaetsdex-sicherung.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),3000)};document.getElementById('import').onclick=()=>document.getElementById('file').click();document.getElementById('file').onchange=async e=>{const f=e.target.files[0];if(!f)return;try{const obj=JSON.parse(await f.text());if(!['QualitätsDex','LivingDex'].includes(obj.app)||typeof obj.values!=='object'||!obj.values)throw Error();if(!confirm('Vorhandene Häkchen durch diese Sicherung ersetzen?'))return;values=obj.values;extra=obj.extra||{};names={...fallback,...(obj.names||names)};save();localStorage.setItem(NAMEKEY,JSON.stringify(names));draw();notice('Sicherung erfolgreich eingespielt.')}catch{notice('Die Datei ist keine gültige QualitätsDex-Sicherung.')}e.target.value=''};
async function loadNames(){const el=document.getElementById('sync');el.textContent='Deutsche Namen werden geladen …';try{const controller=new AbortController();const timeout=setTimeout(()=>controller.abort(),18000);const response=await fetch('https://raw.githubusercontent.com/PokeAPI/pokeapi/master/data/v2/csv/pokemon_species_names.csv',{signal:controller.signal});clearTimeout(timeout);if(!response.ok)throw Error('Download fehlgeschlagen');const csv=await response.text();let added=0;for(const line of csv.split(/\r?\n/)){const m=line.match(/^(\d+),(\d+),"?([^",]*)"?,/);if(m&&+m[2]===6&&+m[1]<=TOTAL){names[+m[1]]=m[3];added++}}if(added<950)throw Error('Namensliste unvollständig ('+added+')');localStorage.setItem(NAMEKEY,JSON.stringify(names));el.textContent='✓ Deutsche Namen geladen und für die Offline-Nutzung gespeichert.';draw()}catch(e){el.textContent='⚠ Namensliste noch nicht vollständig. Bei Internetverbindung „Namen laden“ drücken.';notice('Die deutschen Namen konnten nicht geladen werden. Die Checkliste funktioniert trotzdem bereits mit allen 1.025 Nummern. Bitte bei Internetverbindung erneut „Namen laden“ drücken.')}}
const ranges=[[1,151],[152,251],[252,386],[387,493],[494,649],[650,721],[722,809],[810,905],[906,1025]];
let progressMode=false;
function initProgress(){const g=document.getElementById('generation');g.innerHTML='<option value="0">Gesamter Pokédex</option>'+ranges.map((r,j)=>`<option value="${j+1}">Generation ${j+1}</option>`).join('');g.onchange=renderProgress;document.getElementById('tabdex').onclick=()=>togglePage(false);document.getElementById('tabprogress').onclick=()=>togglePage(true)}
function togglePage(p){progressMode=p;document.getElementById('tabdex').classList.toggle('active',!p);document.getElementById('tabprogress').classList.toggle('active',p);document.getElementById('toolarea').classList.toggle('hidden',p);document.getElementById('list').classList.toggle('hidden',p);document.getElementById('progressPage').classList.toggle('hidden',!p);if(p)renderProgress()}
function renderProgress(){const v=+document.getElementById('generation').value;const [a,b]=v?ranges[v-1]:[1,TOTAL];const n=b-a+1;let own=0,caught=0,quality=0,excellent=0;for(let i=a;i<=b;i++){if(extra[i]?.owned)own++;if(extra[i]?.caught)caught++;if(['good','excellent'].includes(values[i]))quality++;if(values[i]==='excellent')excellent++}const arr=[['✓ Living Dex',own,'Pokémon vorhanden'],['🧢 Selbst gefangen',caught,'Eigene Fänge'],['⭐ QualitätsDex',quality,'Sehr groß oder Exzellent'],['✨ Exzellent',excellent,'Nur exzellente Pokémon']];document.getElementById('progressCards').innerHTML=arr.map(([name,num,desc])=>`<div class="progresscard"><strong>${name}</strong><p>${num} / ${n} · ${(100*num/n).toFixed(1).replace('.',',')} %</p><div class="bar"><div style="width:${100*num/n}%"></div></div><small>${desc} · Noch ${n-num} offen</small></div>`).join('')}
const api='https://pokeapi.co/api/v2/';const versionNames={'scarlet':'Karmesin','brilliant-diamond':'Strahlender Diamant','shining-pearl':'Leuchtende Perle','legends-arceus':'Legenden: Arceus','sword':'Schwert','shield':'Schild'};
const gameHints='Priorität: Karmesin (inkl. DLC), Leuchtende Perle, Legenden: Arceus, Legenden: Z-A und Pokémon GO.';
function escapeHTML(t){return String(t).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
const methods={'level-up':'Levelaufstieg','trade':'Tausch','use-item':'Entwicklungsstein/Item','shed':'Spezialentwicklung','spin':'Drehen','three-critical-hits':'3 Volltreffer','take-damage':'Schaden erleiden','other':'Besondere Bedingung'};
function evolutionDescription(d){if(!d)return 'Basisform';let parts=[methods[d.trigger?.name]||d.trigger?.name||'Spezialentwicklung'];if(d.min_level)parts.push('ab Level '+d.min_level);if(d.item)parts.push('mit '+d.item.name.replaceAll('-',' '));if(d.held_item)parts.push('mit getragenem Item '+d.held_item.name.replaceAll('-',' '));if(d.time_of_day)parts.push('Tageszeit: '+d.time_of_day);if(d.min_happiness)parts.push('hohe Freundschaft');if(d.known_move)parts.push('Attacke '+d.known_move.name.replaceAll('-',' '));if(d.location)parts.push('an bestimmtem Ort');if(d.gender===1)parts.push('weiblich');if(d.gender===2)parts.push('männlich');return parts.join(' · ')}
async function showDetail(i){const dlg=document.getElementById('detail'),body=document.getElementById('detailBody');dlg.showModal();body.innerHTML=`<h3>#${String(i).padStart(4,'0')} ${escapeHTML(names[i]||'Pokémon')}</h3><img src="https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/other/official-artwork/${i}.png" alt=""><p>Entwicklungen und Fundorte werden geladen …</p>`;try{const sp=await fetch(api+'pokemon-species/'+i+'/').then(r=>{if(!r.ok)throw Error();return r.json()});const evo=await fetch(sp.evolution_chain.url).then(r=>r.json());const species=[];function walk(node,from){const de=names[node.species.url.match(/\/(\d+)\/$/)?.[1]]||node.species.name;species.push({name:de,from});node.evolves_to.forEach(child=>walk(child,child.evolution_details?.[0]))}walk(evo.chain,null);const pokemon=await fetch(api+'pokemon/'+i+'/').then(r=>r.json());const locations=await fetch(pokemon.location_area_encounters).then(r=>r.json());let matches=[];for(const loc of locations){for(const vd of loc.version_details){const game=versionNames[vd.version.name];if(game&&['Karmesin','Leuchtende Perle','Legenden: Arceus'].includes(game))matches.push(game+': '+loc.location_area.name.replaceAll('-',' '))}}matches=[...new Set(matches)].slice(0,12);body.innerHTML=`<h3>#${String(i).padStart(4,'0')} ${escapeHTML(names[i]||'Pokémon')}</h3><img src="https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/other/official-artwork/${i}.png" alt=""><section><strong>Entwicklungsreihe</strong>${species.map((x,j)=>`<p>${j?'→ ':''}${escapeHTML(x.name)} ${x.from?'<small>('+escapeHTML(evolutionDescription(x.from))+')</small>':''}</p>`).join('')}<small>Einzelne Sonderentwicklungen können spielabhängig abweichen.</small></section><section><strong>Fundorte in deinen Spielen</strong><p>${matches.length?matches.map(x=>'• '+escapeHTML(x)).join('<br>'):'Keine direkt abrufbaren Fundorte in den unterstützten Spielen.'}</p><small>${gameHints} DLC-, Raid-, GO- und Z-A-Fundorte sind in der verwendeten Datenquelle nicht vollständig enthalten. Keine Fundortangabe bedeutet nicht, dass das Pokémon unerhältlich ist.</small></section>`}catch{body.innerHTML+='<p>Die Informationen konnten gerade nicht geladen werden. Bitte Internetverbindung prüfen.</p>'}}
document.getElementById('closeDetail').onclick=()=>document.getElementById('detail').close();

if('serviceWorker' in navigator && location.protocol.startsWith('http')){window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}))}document.getElementById('names').onclick=loadNames;initProgress();draw();if(Object.keys(names).length<950&&navigator.onLine)loadNames();else if(Object.keys(names).length>=950)document.getElementById('sync').textContent='✓ Deutsche Namen lokal gespeichert – auch offline nutzbar.';
</script></body></html>
